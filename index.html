    <!-- Resolve the theme before first paint so neither the splash nor the app
         ever flashes the wrong colours. Kept inline and synchronous on purpose. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('lc.theme')
          var resolved =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', resolved)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#08090f' : '#f6f7fc')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>

    <!-- Critical splash CSS: this is what the visitor sees while the bundle
         downloads. It must not depend on any stylesheet that ships with JS. -->
    <style>
      :root {
        --splash-bg: #f6f7fc;
        --splash-ink: #12131c;
        --splash-track: rgba(15, 18, 40, 0.1);
      }
      :root[data-theme='dark'] {
        --splash-bg: #08090f;
        --splash-ink: #e9eaf2;
        --splash-track: rgba(255, 255, 255, 0.12);
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--splash-bg);
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: var(--splash-bg);
        color: var(--splash-ink);
        font-family: ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
        transition: opacity 0.45s ease;
      }
      #splash[data-hidden='true'] {
        opacity: 0;
        pointer-events: none;
      }
      #splash .mark {
        font-size: 42px;
        font-weight: 700;
        letter-spacing: -0.03em;
        background: linear-gradient(120deg, #4f6df5, #8b5cf6);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #splash .track {
        position: relative;
        width: 168px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--splash-track);
      }
      #splash .track span {
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, #4f6df5, #8b5cf6);
        animation: splash-slide 1.15s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      #splash .label {
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        opacity: 0.55;
      }
      @keyframes splash-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash {
          transition: none;
        }
        #splash .track span {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
